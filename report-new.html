<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#39a6de" />
  <title>Novo Relatório - E-Multi SME</title>
  <link rel="manifest" href="manifest.json" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="app-header">
    <a href="professional.html" class="btn btn-outline btn-sm">← Voltar</a>
    <div class="header-brand">Novo Relatório</div>
    <div style="width: 60px;"></div> <!-- Espaçador -->
  </header>

  <main class="app-main">
    <form id="formReport" class="report-form">
      <div id="dynamicFields" class="dynamic-fields">
        <!-- Campos injetados via JS -->
        <p class="loading-text">Carregando formulário...</p>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary btn-block" id="btnSubmitReport">
          Salvar Relatório
        </button>
      </div>
    </form>
  </main>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

  <script src="js/firebase-config.js"></script>
  <script src="js/report.js"></script>
</body>
</html>
