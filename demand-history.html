<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#39a6de" />
  <title>Histórico - E-Multi SME</title>
  <link rel="manifest" href="manifest.json" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="app-header">
    <a href="professional.html" class="btn btn-outline btn-sm">← Voltar</a>
    <div class="header-brand">Histórico de Demandas</div>
    <div style="width: 60px;"></div>
  </header>

  <main class="app-main">
    <div id="historyList" class="history-list">
      <p class="loading-text">Carregando demandas concluídas...</p>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

  <script src="js/firebase-config.js"></script>
  <script>
    const historyList = document.getElementById('historyList');

    auth.onAuthStateChanged(async (user) => {
      if (!user) {
        window.location.href = 'index.html';
        return;
      }

      try {
        // Busca apenas as demandas CONCLUÍDAS do profissional logado
        const snap = await db.collection('demandas')
          .where('uidProfissional', '==', user.uid)
          .where('status', '==', 'concluida')
          .get();

        if (snap.empty) {
          historyList.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">📁</div>
              <h3>Nenhuma demanda concluída</h3>
              <p>Você ainda não encerrou nenhum caso.</p>
              <a href="professional.html" class="btn btn-primary" style="margin-top: 16px;">Voltar ao início</a>
            </div>
          `;
          return;
        }

        const demands = [];
        snap.forEach(doc => demands.push({ id: doc.id, ...doc.data() }));
        
        // Ordena pela data de conclusão (mais recente primeiro)
        demands.sort((a, b) => {
          const dateA = a.concluidoEm ? a.concluidoEm.toMillis() : 0;
          const dateB = b.concluidoEm ? b.concluidoEm.toMillis() : 0;
          return dateB - dateA;
        });

        historyList.innerHTML = '';
        
        demands.forEach(d => {
          const dateStr = d.concluidoEm 
            ? d.concluidoEm.toDate().toLocaleDateString('pt-BR')
            : 'Data indisponível';

          const card = document.createElement('div');
          card.className = 'history-card';
          card.innerHTML = `
            <div class="history-card-header">
              <span class="history-date">📅 Concluída em: ${dateStr}</span>
              <span class="history-badge" style="background:#eaf5fc; color:var(--azul);">Fechada</span>
            </div>
            <div class="history-card-body">
              <h4>${d.tema}</h4>
              <p>${d.escola}</p>
            </div>
            <div class="history-card-footer">
              <a href="demand-view.html?id=${d.id}" class="btn btn-outline btn-sm">Abrir Demanda</a>
            </div>
          `;
          historyList.appendChild(card);
        });

      } catch (err) {
        console.error('Erro ao buscar histórico:', err);
        historyList.innerHTML = '<p class="error-text">Erro ao carregar histórico.</p>';
      }
    });
  </script>
</body>
</html>
