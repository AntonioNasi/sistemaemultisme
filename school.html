<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#5abe64" />
  <title>Painel da Escola - E-Multi SME</title>
  <link rel="manifest" href="manifest.json" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="app-header">
    <div class="header-brand">
      <img src="assets/icons/icon-192.png" alt="Ícone" class="header-logo" onerror="this.style.display='none'" style="border-radius: 8px;" />
      <span>E-Multi SME (Escola)</span>
    </div>
    <button id="btnLogout" class="btn btn-outline btn-sm">Sair</button>
  </header>

  <main class="app-main professional-home">
    
    <!-- Perfil da Escola -->
    <section class="profile-card">
      <div class="profile-photo-wrapper">
        <img id="profPhoto" src="" alt="Foto" class="profile-photo" style="display:none;" />
        <div id="profPhotoPlaceholder" class="profile-photo-placeholder">?</div>
      </div>
      <div class="profile-info">
        <h2 id="profName">Carregando...</h2>
        <span id="profRole" class="profile-badge">...</span>
      </div>
    </section>

    <!-- Botões de Ação -->
    <section class="action-grid" style="grid-template-columns: 1fr 1fr;">
      <a href="demand-new-school.html" class="action-card">
        <div class="action-icon icon-new">➕</div>
        <h3>Nova Solicitação</h3>
        <p>Abrir um novo pedido de atendimento</p>
      </a>

      <a href="demand-history-school.html" class="action-card">
        <div class="action-icon icon-history">📂</div>
        <h3>Histórico</h3>
        <p>Solicitações concluídas</p>
      </a>
    </section>

    <!-- NOVO: Demandas Ativas da Escola -->
    <section class="open-demands-section">
      <div class="section-title">
        <h3>Minhas Solicitações Ativas</h3>
        <span id="activeDemandsCount" class="badge-count">0</span>
      </div>
      
      <div id="activeDemandsList" class="demands-grid">
        <p class="loading-text">Buscando solicitações...</p>
      </div>
    </section>

  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

  <script src="js/firebase-config.js"></script>
  <script>
        auth.onAuthStateChanged(async (user) => {
      if (!user) { window.location.href = 'index.html'; return; }

      try {
        const doc = await db.collection(COLLECTION_USERS).doc(user.uid).get();
        if (!doc.exists || doc.data().role !== 'escola') {
          alert('Acesso negado. Área exclusiva de escolas.');
          await auth.signOut();
          window.location.href = 'index.html';
          return;
        }

        const data = doc.data();
        document.getElementById('profName').textContent = data.nomeCompleto;
        document.getElementById('profRole').textContent = data.cargo;

        if (data.fotoUrl) {
          const img = document.getElementById('profPhoto');
          img.src = data.fotoUrl;
          img.style.display = 'block';
          document.getElementById('profPhotoPlaceholder').style.display = 'none';
        } else {
          document.getElementById('profPhotoPlaceholder').textContent = data.nomeCompleto.charAt(0);
        }

        // Carrega as demandas ativas (Pendentes e Abertas)
        loadActiveDemands(user.uid);

      } catch (err) {
        console.error('Erro ao carregar perfil:', err);
      }
    });

    async function loadActiveDemands(uid) {
      const list = document.getElementById('activeDemandsList');
      const countBadge = document.getElementById('activeDemandsCount');
      
      try {
        const snap = await db.collection('demandas').where('uidEscola', '==', uid).get();
        
        // Filtra apenas as ativas
        const active = [];
        snap.forEach(doc => {
          const data = doc.data();
          if (data.status === 'pendente' || data.status === 'aberta') {
            active.push({ id: doc.id, ...data });
          }
        });

        if (active.length === 0) {
          list.innerHTML = '<p class="empty-text">Nenhuma solicitação ativa no momento.</p>';
          countBadge.textContent = '0';
          return;
        }

        active.sort((a, b) => b.criadoEm.toMillis() - a.criadoEm.toMillis());
        countBadge.textContent = active.length;
        list.innerHTML = '';

                active.forEach(d => {
          const dateStr = d.criadoEm && typeof d.criadoEm.toDate === 'function'
            ? d.criadoEm.toDate().toLocaleDateString('pt-BR')
            : 'Data indisponível';
          
          let statusBadge = '';
          if (d.status === 'pendente') {
            statusBadge = '<span class="demand-badge" style="background:#f7d210; color:#333;">Aguardando Triagem</span>';
          } else if (d.status === 'aberta') {
            statusBadge = `<span class="demand-badge" style="background:#eaf5fc; color:var(--azul);">Em Atendimento (${d.nomeProfissional})</span>`;
          }

          // LÓGICA DE MENSAGEM NÃO LIDA PARA A ESCOLA
          let temMensagemNova = false;
          if (d.mensagens && d.mensagens.length > 0) {
            const ultimaMsg = d.mensagens[d.mensagens.length - 1];
            if (ultimaMsg.autorId !== auth.currentUser.uid) {
              temMensagemNova = true;
            }
          }

          const card = document.createElement('div');
          card.className = 'demand-card';
          card.style.cursor = 'default';
          
          card.innerHTML = `
            <div class="demand-card-header">
              <span class="demand-date">📅 ${dateStr}</span>
              ${statusBadge}
            </div>
            <h4>${d.tema}</h4>
            <p>${d.detalhesIniciais ? d.detalhesIniciais.substring(0, 60) + '...' : ''}</p>
            
            <div style="margin-top: 12px; text-align: right; display: flex; justify-content: flex-end; gap: 8px; align-items: center;">
              
              ${d.status === 'pendente' ? `
                <button class="btn btn-sm btn-outline" onclick="cancelDemand('${d.id}')" style="color: var(--erro); border-color: var(--erro);">Cancelar</button>
              ` : ''}

              ${d.status === 'aberta' ? `
                <button class="btn btn-sm btn-outline" onclick="openChatModal('${d.id}')" style="display: flex; align-items: center; gap: 6px;">
                  ${temMensagemNova ? '<span class="dot-new-msg"></span>' : ''}
                  💬 Conversar
                </button>
              ` : ''}
              
            </div>
          `;
          list.appendChild(card);
        });

      } catch (err) {
        console.error(err);
        list.innerHTML = '<p class="error-text">Erro ao carregar solicitações.</p>';
      }
    }

    window.cancelDemand = async (id) => {
      if (!confirm('Tem certeza que deseja cancelar esta solicitação? Ela não será mais enviada para os profissionais.')) return;
      
      try {
        await db.collection('demandas').doc(id).update({
          status: 'cancelada',
          atualizadoEm: firebase.firestore.FieldValue.serverTimestamp()
        });
        alert('Solicitação cancelada.');
        // Recarrega a lista
        auth.currentUser && loadActiveDemands(auth.currentUser.uid);
      } catch (err) {
        alert('Erro ao cancelar: ' + err.message);
      }
    };

    document.getElementById('btnLogout').addEventListener('click', () => {
      auth.signOut().then(() => window.location.href = 'index.html');
    });

        
  </script>
  

    <!-- MODAL: CHAT DA DEMANDA -->
  <div id="modalChat" class="modal-overlay">
    <div class="modal-card" style="max-width: 500px;">
      <div class="modal-header">
        <h3>Conversa com a Equipe</h3>
        <button class="modal-close" onclick="document.getElementById('modalChat').classList.remove('visible')">&times;</button>
      </div>
      <div class="modal-form">
        <div id="chatMessagesSchool" class="chat-container" style="min-height: 200px; max-height: 400px;">
          <p class="empty-text">Carregando...</p>
        </div>
        <form id="formChatSchool" class="chat-input-area" style="margin-top: 12px;">
          <input type="hidden" id="chatDemandId" />
          <input type="text" id="chatInputSchool" placeholder="Digite uma mensagem para o profissional..." autocomplete="off" required />
          <button type="submit" class="btn btn-primary btn-sm" id="btnSendChatSchool">Enviar</button>
        </form>
      </div>
    </div>
  </div>


  <script>
    // --- LÓGICA DO CHAT DA ESCOLA ---
    let currentChatDemand = null;

    window.openChatModal = async (demandId) => {
      document.getElementById('chatDemandId').value = demandId;
      const chatDiv = document.getElementById('chatMessagesSchool');
      chatDiv.innerHTML = '<p class="empty-text">Carregando...</p>';
      
      document.getElementById('modalChat').classList.add('visible');

      try {
        const doc = await db.collection('demandas').doc(demandId).get();
        currentChatDemand = { id: doc.id, ...doc.data() };
        
        renderSchoolChat();
      } catch (err) {
        chatDiv.innerHTML = '<p class="error-text">Erro ao carregar mensagens.</p>';
      }
    };

    function renderSchoolChat() {
      const chatDiv = document.getElementById('chatMessagesSchool');
      const mensagens = currentChatDemand.mensagens || [];
      
      if (mensagens.length === 0) {
        chatDiv.innerHTML = '<p class="empty-text">Nenhuma mensagem ainda. Inicie a conversa.</p>';
        return;
      }

      chatDiv.innerHTML = '';
      mensagens.sort((a, b) => new Date(a.data) - new Date(b.data));
      
      mensagens.forEach(m => {
        // Compara o ID do autor com o UID do usuário logado (Escola)
        const isMe = m.autorId === auth.currentUser.uid;
        const el = document.createElement('div');
        el.className = `chat-bubble ${isMe ? 'chat-mine' : 'chat-theirs'}`;
        el.innerHTML = `
          <span class="chat-author">${m.autorNome}</span>
          <p>${m.texto}</p>
          <span class="chat-time">${new Date(m.data).toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'})}</span>
        `;
        chatDiv.appendChild(el);
      });
      chatDiv.scrollTop = chatDiv.scrollHeight;
    }

    document.getElementById('formChatSchool').addEventListener('submit', async (e) => {
      e.preventDefault();
      const demandId = document.getElementById('chatDemandId').value;
      const input = document.getElementById('chatInputSchool');
      const texto = input.value.trim();
      if (!texto) return;

      const btn = document.getElementById('btnSendChatSchool');
      btn.disabled = true;

      const novaMensagem = {
        id: 'msg_' + Date.now(),
        autorId: auth.currentUser.uid,
        autorNome: document.getElementById('profName').textContent, // Nome da escola
        texto: texto,
        data: new Date().toISOString()
      };

      try {
        const novasMensagens = [...(currentChatDemand.mensagens || []), novaMensagem];
        await db.collection('demandas').doc(demandId).update({
          mensagens: novasMensagens
        });
        
        currentChatDemand.mensagens = novasMensagens;
        input.value = '';
        renderSchoolChat();
      } catch (err) {
        alert('Erro ao enviar: ' + err.message);
      } finally {
        btn.disabled = false;
      }
    });
  </script>
  <script src="js/version.js"></script>
</body>
</html>
